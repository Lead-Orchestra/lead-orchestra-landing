name: Deploy to Cloudflare Pages

permissions:
  contents: read
  deployments: write

on:
  push:
    branches:
      - cloudflare-deploy  # Deploy from cloudflare-deploy branch
      - main  # Optional: also deploy from main if needed
  workflow_dispatch:  # Allow manual trigger
  pull_request:
    branches:
      - cloudflare-deploy
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: |
          docker build \
            --platform=linux/amd64 \
            -f Dockerfile.pages.standalone \
            -t dealscale-pages:latest \
            .

      - name: Extract build output
        run: |
          docker create --name temp-dealscale dealscale-pages:latest
          docker cp temp-dealscale:/output ./cloudflare-output
          docker rm temp-dealscale
          
          # Verify output exists
          ls -la cloudflare-output/ || (echo "Build output not found!" && exit 1)

      - name: Verify Cloudflare secrets
        run: |
          if [ -z "${{ secrets.CLOUDFLARE_API_TOKEN }}" ] && [ -z "${{ secrets.CLOUDFLARE_PAGES_API_TOKEN }}" ] && [ -z "${{ secrets.CF_API_TOKEN }}" ]; then
            echo "Missing Cloudflare API token. Set one of: CLOUDFLARE_API_TOKEN, CLOUDFLARE_PAGES_API_TOKEN, CF_API_TOKEN"
            exit 1
          fi
          if [ -z "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" ] && [ -z "${{ secrets.CF_ACCOUNT_ID }}" ]; then
            echo "Missing Cloudflare account ID. Set one of: CLOUDFLARE_ACCOUNT_ID, CF_ACCOUNT_ID"
            exit 1
          fi

      - name: Deploy to Cloudflare Pages
        # Prevent forks from trying to create GitHub Deployments (will 403).
        if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.head.repo.fork }}
        uses: cloudflare/pages-action@v1
        with:
          # Support a few common secret names so the workflow works with existing setups.
          # Recommended secrets:
          # - CLOUDFLARE_API_TOKEN
          # - CLOUDFLARE_ACCOUNT_ID
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CLOUDFLARE_PAGES_API_TOKEN || secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || secrets.CF_ACCOUNT_ID }}
          # Must match an existing Pages project name in Cloudflare exactly
          projectName: lead-orchestra
          directory: cloudflare-output
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          # This action does not accept a `production` input.
          # Cloudflare Pages decides "production vs preview" based on the configured production branch.
          branch: ${{ github.head_ref || github.ref_name }}

      - name: Cleanup
        if: always()
        run: |
          rm -rf cloudflare-output || true



