name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - cloudflare-deploy  # Deploy from cloudflare-deploy branch
      - main  # Optional: also deploy from main if needed
  workflow_dispatch:  # Allow manual trigger
  pull_request:
    branches:
      - cloudflare-deploy
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: |
          docker build \
            --platform=linux/amd64 \
            -f Dockerfile.pages.standalone \
            -t dealscale-pages:latest \
            .

      - name: Extract build output
        run: |
          docker create --name temp-dealscale dealscale-pages:latest
          docker cp temp-dealscale:/output ./cloudflare-output
          docker rm temp-dealscale
          
          # Verify output exists
          ls -la cloudflare-output/ || (echo "Build output not found!" && exit 1)

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: dealscale
          directory: cloudflare-output
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          # Deploy to production only on main/cloudflare-deploy branch pushes
          # Preview deployments for PRs
          production: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/cloudflare-deploy') }}

      - name: Cleanup
        if: always()
        run: |
          rm -rf cloudflare-output || true



